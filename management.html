<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>人数管理画面</title>

  <style>

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }

    .main-count {
      background: #222;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 25px;
    }

    .main-count-title {
      font-size: 28px;
    }

    #peopleCount {
      font-size: 110px;
      font-weight: bold;
    }

    .unit {
      font-size: 40px;
    }

    .cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: #222;
      border-radius: 15px;
      padding: 30px;
      min-width: 220px;
    }

    .card-title {
      font-size: 22px;
    }

    .number {
      font-size: 60px;
      font-weight: bold;
      margin-top: 15px;
    }

    .visible {
      color: #aaa;
    }

    .status {
      margin-top: 30px;
      background: #222;
      border-radius: 15px;
      padding: 25px;
      text-align: left;
      font-size: 20px;
    }

    .status div {
      margin: 12px 0;
    }

    .ok {
      color: #00ff66;
    }

    .ng {
      color: #ff6666;
    }

    #errorMessage {
      color: #ff6666;
      margin-top: 20px;
    }

    /* ==========================================
       リセットボタン
       ========================================== */

    .reset-area {
      margin-top: 35px;
    }

    #resetButton {
      border: none;
      border-radius: 12px;

      background: #d32f2f;
      color: white;

      font-size: 22px;
      font-weight: bold;

      padding: 18px 45px;

      cursor: pointer;

      transition: 0.2s;
    }

    #resetButton:hover {
      background: #f44336;
      transform: scale(1.03);
    }

    #resetButton:active {
      transform: scale(0.98);
    }

    #resetButton:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #resetStatus {
      margin-top: 15px;
      font-size: 18px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📊 人数管理システム</h1>


    <!-- ========================================
         現在人数
         ======================================== -->

    <div class="main-count">

      <div class="main-count-title">
        現在の人数
      </div>

      <div>

        <span id="peopleCount">
          0
        </span>

        <span class="unit">
          人
        </span>

      </div>

    </div>


    <!-- ========================================
         入室・退出・カメラ内人数
         ======================================== -->

    <div class="cards">


      <div class="card">

        <div class="card-title">
          入室
        </div>

        <div
          id="enteredCount"
          class="number"
        >
          0
        </div>

        <div>
          人
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          退出
        </div>

        <div
          id="exitedCount"
          class="number"
        >
          0
        </div>

        <div>
          人
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          現在カメラに映っている人数
        </div>

        <div
          id="visiblePeopleCount"
          class="number visible"
        >
          0
        </div>

        <div>
          人
        </div>

      </div>


    </div>


    <!-- ========================================
         状態
         ======================================== -->

    <div class="status">

      <div>
        Firebase：
        <span
          id="firebaseStatus"
          class="ok"
        >
          接続中...
        </span>
      </div>


      <div>
        カメラ：
        <span id="cameraStatus">
          確認中...
        </span>
      </div>


      <div>
        AI：
        <span id="aiStatus">
          確認中...
        </span>
      </div>


      <div>
        最終更新：
        <span id="updateTime">
          --
        </span>
      </div>

    </div>


    <!-- ========================================
         リセット
         ======================================== -->

    <div class="reset-area">

      <button
        id="resetButton"
      >
        🔄 データをリセット
      </button>

      <div id="resetStatus"></div>

    </div>


    <div id="errorMessage"></div>

  </div>


  <!-- ==========================================
       Firebase
       ========================================== -->

  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      onValue,
      set
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // Firebase設定
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAslBm8rtnbcpuMTMHHJbErpJoMp_im-fg",

      authDomain:
        "aininnzuukannri-136ec.firebaseapp.com",

      databaseURL:
        "https://aininnzuukannri-136ec-default-rtdb.firebaseio.com",

      projectId:
        "aininnzuukannri-136ec",

      storageBucket:
        "aininnzuukannri-136ec.firebasestorage.app",

      messagingSenderId:
        "761746001349",

      appId:
        "1:761746001349:web:f01d89e616dfe5689ccfac",

      measurementId:
        "G-D053Q0CVGR"

    };


    // ==========================================
    // Firebase開始
    // ==========================================

    try {

      const app =
        initializeApp(
          firebaseConfig
        );


      const db =
        getDatabase(
          app
        );


      document
        .getElementById(
          "firebaseStatus"
        )
        .textContent =
        "接続OK";


      // ========================================
      // 人数データ
      // ========================================

      const peopleRef =
        ref(
          db,
          "people/current"
        );


      onValue(

        peopleRef,

        function(snapshot) {

          const data =
            snapshot.val();


          console.log(
            "受信データ:",
            data
          );


          if (!data) {
            return;
          }


          // ------------------------------------
          // 現在人数
          // ------------------------------------

          document
            .getElementById(
              "peopleCount"
            )
            .textContent =
            data.peopleCount ?? 0;


          // ------------------------------------
          // 入室
          // ------------------------------------

          document
            .getElementById(
              "enteredCount"
            )
            .textContent =
            data.enteredCount ?? 0;


          // ------------------------------------
          // 退出
          // ------------------------------------

          document
            .getElementById(
              "exitedCount"
            )
            .textContent =
            data.exitedCount ?? 0;


          // ------------------------------------
          // カメラ内
          // ------------------------------------

          document
            .getElementById(
              "visiblePeopleCount"
            )
            .textContent =
            data.visiblePeopleCount ?? 0;


          // ------------------------------------
          // カメラ状態
          // ------------------------------------

          const cameraStatus =
            document.getElementById(
              "cameraStatus"
            );


          if (
            data.cameraReady
          ) {

            cameraStatus.textContent =
              "接続OK";

            cameraStatus.className =
              "ok";

          }

          else {

            cameraStatus.textContent =
              "接続待ち";

            cameraStatus.className =
              "ng";

          }


          // ------------------------------------
          // AI状態
          // ------------------------------------

          const aiStatus =
            document.getElementById(
              "aiStatus"
            );


          if (
            data.modelReady
          ) {

            aiStatus.textContent =
              "稼働中";

            aiStatus.className =
              "ok";

          }

          else {

            aiStatus.textContent =
              "読み込み中";

            aiStatus.className =
              "ng";

          }


          // ------------------------------------
          // 更新時間
          // ------------------------------------

          if (
            data.updatedAt
          ) {

            const date =
              new Date(
                data.updatedAt
              );


            document
              .getElementById(
                "updateTime"
              )
              .textContent =
              date.toLocaleTimeString();

          }

        },


        function(error) {

          console.error(
            error
          );


          document
            .getElementById(
              "firebaseStatus"
            )
            .textContent =
            "接続エラー";


          document
            .getElementById(
              "errorMessage"
            )
            .textContent =
            "Firebaseからデータを取得できません。";

        }

      );


      // ========================================
      // リセットボタン
      // ========================================

      const resetButton =
        document.getElementById(
          "resetButton"
        );


      const resetStatus =
        document.getElementById(
          "resetStatus"
        );


      resetButton.addEventListener(
        "click",
        async function() {


          // ------------------------------------
          // 確認
          // ------------------------------------

          const answer =
            confirm(

              "人数データをすべてリセットしますか？\n\n" +

              "現在人数 → 0人\n" +
              "入室 → 0人\n" +
              "退出 → 0人\n\n" +

              "この操作を実行します。"

            );


          if (!answer) {

            return;

          }


          // ------------------------------------
          // ボタン停止
          // ------------------------------------

          resetButton.disabled =
            true;


          resetStatus.textContent =
            "リセットしています...";


          resetStatus.style.color =
            "white";


          try {


            // ==================================
            // リセット命令をFirebaseへ
            // ==================================

            const resetRef =
              ref(
                db,
                "people/reset"
              );


            await set(

              resetRef,

              {
                command:
                  "reset",

                time:
                  Date.now()
              }

            );


            // ----------------------------------
            // PC画面側も即座に0にする
            // ----------------------------------

            document
              .getElementById(
                "peopleCount"
              )
              .textContent =
              "0";


            document
              .getElementById(
                "enteredCount"
              )
              .textContent =
              "0";


            document
              .getElementById(
                "exitedCount"
              )
              .textContent =
              "0";


            // ----------------------------------
            // 完了
            // ----------------------------------

            resetStatus.textContent =
              "✅ リセットしました";


            resetStatus.style.color =
              "#00ff66";


            console.log(
              "リセット命令を送信しました"
            );


          }

          catch (error) {

            console.error(
              "リセットエラー:",
              error
            );


            resetStatus.textContent =
              "❌ リセットに失敗しました";


            resetStatus.style.color =
              "#ff6666";

          }


          // ------------------------------------
          // ボタン復活
          // ------------------------------------

          setTimeout(
            function() {

              resetButton.disabled =
                false;

            },
            1500
          );


        }
      );


    }


    catch (error) {

      console.error(
        error
      );


      document
        .getElementById(
          "firebaseStatus"
        )
        .textContent =
        "接続エラー";


      document
        .getElementById(
          "errorMessage"
        )
        .textContent =
        "Firebase設定を確認してください。";

    }

  </script>

</body>

</html>
