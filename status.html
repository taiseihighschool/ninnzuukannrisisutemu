<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>食堂 混雑状況</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

body {
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 600px;
  padding: 24px 18px 40px;
}

/* ヘッダー */
.header {
  text-align: center;
  margin-bottom: 22px;
}

.header .icon {
  font-size: 42px;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 27px;
}

.header p {
  margin: 0;
  color: #6b7280;
  font-size: 14px;
}

/* メインカード */
.main-card {
  background: white;
  border-radius: 28px;
  padding: 30px 20px;
  text-align: center;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
  margin-bottom: 18px;
}

.main-title {
  font-size: 17px;
  color: #6b7280;
  margin-bottom: 8px;
}

.people-number {
  font-size: 92px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -4px;
}

.people-unit {
  font-size: 24px;
  font-weight: 600;
  margin-left: 5px;
}

/* 混雑状態 */
.congestion {
  margin-top: 22px;
  padding: 15px;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 700;
}

.congestion.empty {
  background: #dcfce7;
  color: #166534;
}

.congestion.normal {
  background: #fef3c7;
  color: #92400e;
}

.congestion.crowded {
  background: #fee2e2;
  color: #991b1b;
}

/* 詳細カード */
.info-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.06);
  margin-bottom: 15px;
}

.info-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid #eef0f3;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #6b7280;
}

.value {
  font-weight: 700;
}

/* 接続状態 */
.connection {
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  margin-top: 20px;
}

.connected {
  color: #16a34a;
  font-weight: 700;
}

.disconnected {
  color: #dc2626;
  font-weight: 700;
}

/* 更新 */
.update {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  margin-top: 8px;
}

/* 説明 */
.note {
  background: #eef6ff;
  border-radius: 16px;
  padding: 15px;
  margin-top: 20px;
  color: #475569;
  font-size: 13px;
  line-height: 1.7;
}

@media (max-width: 400px) {

  .container {
    padding: 18px 12px 30px;
  }

  .header h1 {
    font-size: 23px;
  }

  .people-number {
    font-size: 75px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ヘッダー -->
  <div class="header">

    <div class="icon">
      🍴
    </div>

    <h1>
      食堂の混雑状況
    </h1>

    <p>
      AIによるリアルタイム人数管理
    </p>

  </div>


  <!-- 現在人数 -->
  <div class="main-card">

    <div class="main-title">
      現在の食堂人数
    </div>

    <div>
      <span
        id="peopleCount"
        class="people-number"
      >
        0
      </span>

      <span class="people-unit">
        人
      </span>
    </div>

    <div
      id="congestion"
      class="congestion empty"
    >
      🟢 空いています
    </div>

  </div>


  <!-- 詳細 -->
  <div class="info-card">

    <div class="info-title">
      📊 現在の状況
    </div>

    <div class="row">

      <span class="label">
        入室人数
      </span>

      <span
        id="enteredCount"
        class="value"
      >
        0人
      </span>

    </div>

    <div class="row">

      <span class="label">
        退出人数
      </span>

      <span
        id="exitedCount"
        class="value"
      >
        0人
      </span>

    </div>

    <div class="row">

      <span class="label">
        最終更新
      </span>

      <span
        id="updateTime"
        class="value"
      >
        --
      </span>

    </div>

  </div>


  <!-- Firebase状態 -->
  <div class="connection">

    Firebase：
    
    <span
      id="firebaseStatus"
      class="connected"
    >
      接続中...
    </span>

  </div>

  <div
    id="connectionError"
    class="connection"
  >
  </div>


  <!-- 説明 -->
  <div class="note">

    💡 このページでは、食堂に現在何人いるかを
    AI人数管理システムからリアルタイムで確認できます。

    <br><br>

    🟢 0～9人：空いています<br>
    🟡 10～19人：やや混雑<br>
    🔴 20人以上：混雑しています

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* ==========================================
   Firebase設定
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAslBm8rtnbcpuMTMHHJbErpJoMp_im-fg",

  authDomain:
    "aininnzuukannri-136ec.firebaseapp.com",

  databaseURL:
    "https://aininnzuukannri-136ec-default-rtdb.firebaseio.com",

  projectId:
    "aininnzuukannri-136ec",

  storageBucket:
    "aininnzuukannri-136ec.firebasestorage.app",

  messagingSenderId:
    "761746001349",

  appId:
    "1:761746001349:web:f01d89e616dfe5689ccfac",

  measurementId:
    "G-D053Q0CVGR"

};


/* ==========================================
   Firebase開始
========================================== */

try {

  const app =
    initializeApp(
      firebaseConfig
    );

  const db =
    getDatabase(app);

  const peopleRef =
    ref(
      db,
      "people/current"
    );


  document
    .getElementById(
      "firebaseStatus"
    )
    .textContent =
    "接続OK";


  /* ==========================================
     人数データ監視
  ========================================== */

  onValue(

    peopleRef,

    function(snapshot) {

      const data =
        snapshot.val();


      if (!data) {

        document
          .getElementById(
            "peopleCount"
          )
          .textContent =
          "0";

        return;
      }


      /* 現在人数 */

      const count =
        Number(
          data.peopleCount || 0
        );


      document
        .getElementById(
          "peopleCount"
        )
        .textContent =
        count;


      /* 入室 */

      document
        .getElementById(
          "enteredCount"
        )
        .textContent =
        Number(
          data.enteredCount || 0
        ) + "人";


      /* 退出 */

      document
        .getElementById(
          "exitedCount"
        )
        .textContent =
        Number(
          data.exitedCount || 0
        ) + "人";


      /* 混雑表示 */

      const congestion =
        document.getElementById(
          "congestion"
        );


      congestion.className =
        "congestion";


      if (count < 10) {

        congestion.classList.add(
          "empty"
        );

        congestion.textContent =
          "🟢 空いています";

      }

      else if (count < 20) {

        congestion.classList.add(
          "normal"
        );

        congestion.textContent =
          "🟡 やや混雑しています";

      }

      else {

        congestion.classList.add(
          "crowded"
        );

        congestion.textContent =
          "🔴 混雑しています";

      }


      /* 更新時刻 */

      if (data.updatedAt) {

        const date =
          new Date(
            data.updatedAt
          );

        document
          .getElementById(
            "updateTime"
          )
          .textContent =
          date.toLocaleTimeString(
            "ja-JP"
          );

      }

    },

    function(error) {

      console.error(
        "Firebaseエラー:",
        error
      );

      document
        .getElementById(
          "firebaseStatus"
        )
        .textContent =
        "接続エラー";

      document
        .getElementById(
          "firebaseStatus"
        )
        .className =
        "disconnected";

      document
        .getElementById(
          "connectionError"
        )
        .textContent =
        "Firebaseからデータを取得できません。";

    }

  );


}

catch(error) {

  console.error(
    "Firebase初期化エラー:",
    error
  );

  document
    .getElementById(
      "firebaseStatus"
    )
    .textContent =
    "接続エラー";

  document
    .getElementById(
      "firebaseStatus"
    )
    .className =
    "disconnected";

}

</script>

</body>
</html>
