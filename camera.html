<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="screen-orientation"
    content="landscape"
  >

  <title>AI人数管理システム - カメラ</title>

  <!-- p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

  <!-- COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;
      color: white;

      font-family: sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    canvas {
      display: block;

      max-width: 100vw;
      max-height: 100vh;
    }

  </style>

</head>


<body>

  <div id="app"></div>


  <!-- ==========================================
       Firebase
       ========================================== -->

  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      set,
      onValue
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // Firebase設定
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAslBm8rtnbcpuMTMHHJbErpJoMp_im-fg",

      authDomain:
        "aininnzuukannri-136ec.firebaseapp.com",

      databaseURL:
        "https://aininnzuukannri-136ec-default-rtdb.firebaseio.com",

      projectId:
        "aininnzuukannri-136ec",

      storageBucket:
        "aininnzuukannri-136ec.firebasestorage.app",

      messagingSenderId:
        "761746001349",

      appId:
        "1:761746001349:web:f01d89e616dfe5689ccfac",

      measurementId:
        "G-D053Q0CVGR"

    };


    // ==========================================
    // Firebase開始
    // ==========================================

    window.firebaseReady =
      (async function () {

        try {

          const app =
            initializeApp(
              firebaseConfig
            );


          const db =
            getDatabase(
              app
            );


          window.firebaseDB =
            db;


          window.firebaseRef =
            ref;


          window.firebaseSet =
            set;


          // ======================================
          // リセット命令を監視
          // ======================================

          const resetRef =
            ref(
              db,
              "people/reset"
            );


          onValue(
            resetRef,
            function (snapshot) {

              const data =
                snapshot.val();


              if (!data) {
                return;
              }


              if (
                data.command !== "reset"
              ) {
                return;
              }


              const resetTime =
                Number(
                  data.time || 0
                );


              if (
                typeof window.lastResetTime ===
                "undefined"
              ) {

                window.lastResetTime = 0;

              }


              // 同じ命令を
              // 何度も実行しない
              if (
                resetTime <=
                window.lastResetTime
              ) {

                return;

              }


              window.lastResetTime =
                resetTime;


              console.log(
                "Firebaseからリセット命令を受信"
              );


              if (
                typeof resetSystem ===
                "function"
              ) {

                resetSystem();

              }

            }
          );


          console.log(
            "Firebase接続準備完了"
          );


          return db;


        } catch (error) {

          console.error(
            "Firebase初期化エラー:",
            error
          );

        }

      })();

  </script>


  <!-- カメラプログラム -->
  <script src="camera.js"></script>

</body>

</html>
