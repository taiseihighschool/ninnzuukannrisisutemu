<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI人数管理システム</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family: sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .container {

      width: 90%;

      max-width: 700px;

      text-align: center;

    }


    h1 {

      font-size: 42px;

      margin-bottom: 50px;

    }


    .button {

      display: block;

      width: 100%;

      padding: 25px;

      margin: 20px 0;

      border-radius: 15px;

      background: #222;

      color: white;

      text-decoration: none;

      font-size: 25px;

      font-weight: bold;

      transition: 0.2s;

    }


    .button:hover {

      background: #333;

      transform: scale(1.02);

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      AI人数管理システム
    </h1>


    <a
      class="button"
      href="camera.html"
    >
      📷 カメラ画面を開く
    </a>


    <a
      class="button"
      href="management.html"
    >
      📊 人数管理画面を開く
    </a>


  </div>


</body>

</html>
